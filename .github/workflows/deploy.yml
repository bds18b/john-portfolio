# Publishes the site to Cloudflare Pages (project "retentionfirst") on every
# push to main, like the other agency sites. scripts/deploy.mjs does the work.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   • CLOUDFLARE_API_TOKEN   token with Pages: Edit and DNS: Edit
#   • CLOUDFLARE_ACCOUNT_ID  the account id
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# A newer push replaces a deploy that is still running.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
